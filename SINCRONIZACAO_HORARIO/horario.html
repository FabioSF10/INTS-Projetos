<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sincronizador INTS - Precisão Total</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .clock { font-size: 6rem; font-weight: bold; margin-bottom: 30px; text-shadow: 0 0 20px #00ff00; }
        button { background: #00ff00; color: #000; border: none; padding: 25px 50px; font-size: 1.8rem; font-weight: bold; cursor: pointer; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,255,0,0.3); transition: 0.2s; }
        button:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(0,255,0,0.5); }
        .msg { margin-top: 25px; font-size: 1.2rem; color: #555; }
        .highlight { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="clock" id="display">00:00:00</div>
    
    <button onclick="copyTime()">COPIAR: time HH:MM:SS</button>

    <p class="msg" id="status">Aguardando comando...</p>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('display').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);

        function copyTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            // Comando com SEGUNDOS para precisão máxima
            const command = `time ${h}:${m}:${s}`;
            
            navigator.clipboard.writeText(command).then(() => {
                const status = document.getElementById('status');
                status.innerHTML = `Copiado: <span class="highlight">${command}</span>`;
                status.style.color = "#00ff00";
            });
        }
    </script>
</body>
</html>
